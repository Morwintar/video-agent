<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; media-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Lecteur de rediffusion</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #000; color: #fff; font: 14px system-ui, sans-serif; }
    body { display: grid; grid-template-rows: minmax(0, 1fr) auto; }
    video { display: block; width: 100%; height: 100%; min-height: 0; background: #000; object-fit: contain; }
    #status { margin: 0; padding: 0.25rem 0.65rem; color: #d1d5db; background: #111827; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <video id="waiting-studio-video" controls playsinline preload="metadata" aria-label="Lecture de la rediffusion"></video>
  <p id="status" role="status" aria-live="polite">Préparation du lecteur progressif…</p>
  <script src="media-player.js" defer></script>
</body>
</html>
